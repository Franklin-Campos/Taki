<svg width="680" height="500" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo Taki - App de música</title>
  <desc>Logo colorido de Taki con rosa, azul claro y amarillo sobre fondo negro</desc>

  <!-- Fondo negro -->
  <rect x="130" y="20" width="420" height="460" rx="44" fill="#000000"/>

  <!-- Anillo exterior azul claro -->
  <circle cx="340" cy="185" r="125" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.5"/>
  <!-- Anillo medio rosa -->
  <circle cx="340" cy="185" r="112" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.4"/>

  <!-- Círculo principal -->
  <circle cx="340" cy="185" r="100" fill="#0a0a0a"/>

  <!-- Onda 1 - rosa -->
  <path d="M 248 185 Q 270 148 294 185 Q 318 222 342 185 Q 366 148 390 185 Q 414 222 432 185"
        fill="none" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Onda 2 - azul claro -->
  <path d="M 252 170 Q 272 138 296 170 Q 320 202 344 170 Q 368 138 392 170 Q 416 202 432 170"
        fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Onda 3 - amarillo -->
  <path d="M 252 200 Q 272 234 296 200 Q 320 166 344 200 Q 368 234 392 200 Q 416 166 432 200"
        fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Onda 4 - rosa suave arriba -->
  <path d="M 258 155 Q 276 128 300 155 Q 324 182 348 155 Q 372 128 396 155 Q 418 178 426 158"
        fill="none" stroke="#f9a8d4" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Flecha descarga: línea vertical - blanca -->
  <line x1="340" y1="155" x2="340" y2="205" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Punta flecha - amarillo -->
  <polygon points="324,197 340,218 356,197" fill="#fbbf24"/>
  <!-- Base descarga - azul claro -->
  <line x1="322" y1="222" x2="358" y2="222" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Nota musical izquierda - amarilla -->
  <g transform="translate(253,143)">
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#fbbf24" transform="rotate(-20)"/>
    <line x1="8" y1="-2" x2="8" y2="-24" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="-24" x2="22" y2="-19" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="22" cy="-13" rx="9" ry="6" fill="#fbbf24" transform="translate(14,-13) rotate(-20)"/>
  </g>

  <!-- Nota musical derecha - azul claro -->
  <g transform="translate(410,148)">
    <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#38bdf8" transform="rotate(-20)"/>
    <line x1="7" y1="-2" x2="7" y2="-20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7" y1="-20" x2="20" y2="-16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="13" cy="-10" rx="8" ry="5.5" fill="#38bdf8" transform="translate(13,-10) rotate(-20)"/>
  </g>

  <!-- Puntitos decorativos -->
  <circle cx="258" cy="215" r="3.5" fill="#f472b6" opacity="0.8"/>
  <circle cx="422" cy="215" r="3.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="240" cy="185" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="440" cy="185" r="2.5" fill="#fbbf24" opacity="0.6"/>

  <!-- Texto TAKI: cada letra con color diferente -->
  <text x="248" y="335" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="72" fill="#f472b6">T</text>
  <text x="298" y="335" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="72" fill="#38bdf8">A</text>
  <text x="352" y="335" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="72" fill="#fbbf24">K</text>
  <text x="408" y="335" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="72" fill="#ffffff">I</text>

  <!-- Subtítulo -->
  <text x="340" y="362" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="10">música</text>

  <!-- Badges -->
  <rect x="238" y="382" width="88" height="26" rx="6" fill="#f472b6" opacity="0.18"/>
  <text x="282" y="400" text-anchor="middle" fill="#f472b6" font-family="Arial,sans-serif" font-size="12" font-weight="700">YouTube</text>

  <rect x="338" y="382" width="56" height="26" rx="6" fill="#38bdf8" opacity="0.18"/>
  <text x="366" y="400" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="12" font-weight="700">MP3</text>

  <!-- Línea decorativa -->
  <line x1="250" y1="425" x2="310" y2="425" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="340" cy="425" r="4" fill="#fbbf24"/>
  <line x1="370" y1="425" x2="430" y2="425" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

</svg>
